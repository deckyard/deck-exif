# Grimoire book configuration for the @deckyard/exif documentation.

[book]
title = "@deckyard/exif"
description = "Read, modify and delete EXIF metadata in JPEG, PNG and WebP images"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-exif/"
repoUrl = "https://github.com/deckyard/deck-exif"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-exif/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
